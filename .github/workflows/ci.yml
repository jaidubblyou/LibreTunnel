name: CI

# Runs on macos-14+ GitHub-hosted runners, which are genuine Apple Silicon
# (arm64) hardware — matching our arm64-only platform decision, at no cost
# and with no self-hosted/secret infrastructure required.
#
# This workflow is Checkpoint 1 ("clean project builds from source") made
# automatic and repeatable: it is the actual, executed verification that the
# code in this repository builds and its tests pass, since that could not be
# verified in the (non-macOS) environment this scaffold was authored in.
# See PROJECT_STATE.md, Session Checkpoint, for that caveat.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          swift --version
          sw_vers

      - name: Build (debug)
        run: swift build -v

      - name: Run tests
        run: swift test -v
